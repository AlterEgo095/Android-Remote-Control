# Android Remote Control — COMPOSE DE PRODUCTION (VPS Ubuntu 24.04)
# Cible : https://android.aenews.online derrière Nginx (hôte).
#
# Prérequis (voir docs/PLAN-DEPLOIEMENT.md) :
#   1. cp deploy/env.vps.example .env   puis REMPLIR les secrets (openssl rand -base64 48)
#   2. docker compose -f docker-compose.vps.yml up -d --build
#   3. docker compose -f docker-compose.vps.yml run --rm console bun prisma/bootstrap-admin.ts
#
# Garanties : nom de projet dédié (pas de collision avec les autres apps du VPS),
# PostgreSQL jamais publié, secrets obligatoires (:? échoue s'ils manquent),
# healthchecks, rotation des logs, restart automatique, versions épinglées.

name: android-remote-control

services:
  console:
    build:
      context: .
      args:
        ARC_SCHEMA: postgres
    image: arc-console:1.0.0
    container_name: arc-console
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ARC_MODE: production
      ARC_DB_SCHEMA: postgres
      ARC_RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql://arc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/android_remote_control
    ports:
      - "127.0.0.1:3260:3000" # uniquement l'interface locale : Nginx proxifie (3000 déjà pris par une app PM2 sur le VPS — audit 2026-10-17)
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arc-app-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16.4-alpine
    container_name: arc-postgres
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: android_remote_control
    volumes:
      - arc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d android_remote_control"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - arc-app-db
    restart: unless-stopped
    # Pas de `ports:` : la base n'est JAMAIS exposée (critère d'acceptation n° 7).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ——— RustDesk OSS : serveur de SIGNALISATION (hbbs) ———
  # NB : image épinglée ; vérifier la dernière 1.1.x au déploiement
  # (docker manifest inspect rustdesk/rustdesk-server:1.1.12).
  rustdesk-signalisation:
    image: rustdesk/rustdesk-server:1.1.12
    container_name: arc-rustdesk-hbbs
    command: hbbs
    ports:
      - "21115:21115/tcp" # test de disponibilité
      - "21116:21116/tcp" # hole punching / ID
      - "21116:21116/udp" # enregistrement des appareils
      - "21118:21118/tcp" # websocket (clients web)
    volumes:
      - arc-rustdesk-hbbs:/root
    networks:
      - arc-rustdesk-signal # réseau isolé : le relais n'y a pas accès
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ——— RustDesk OSS : serveur de RELAIS (hbbr) ———
  rustdesk-relais:
    image: rustdesk/rustdesk-server:1.1.12
    container_name: arc-rustdesk-hbbr
    command: hbbr
    ports:
      - "21117:21117/tcp" # relais flux/contrôle
      - "21119:21119/tcp" # websocket relais
    volumes:
      - arc-rustdesk-hbbr:/root
    networks:
      - arc-rustdesk-relais # réseau isolé : la signalisation n'y a pas accès
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arc-app-db:
    ipam:
      config:
        - subnet: 172.32.0.0/16 # épinglé : les sous-réseaux 172.17–172.31 sont déjà pris par les autres stacks du VPS (audit 2026-10-17)
  arc-rustdesk-signal:
    ipam:
      config:
        - subnet: 172.32.1.0/24
  arc-rustdesk-relais:
    ipam:
      config:
        - subnet: 172.32.2.0/24

volumes:
  arc-pgdata: {}
  arc-rustdesk-hbbs: {}
  arc-rustdesk-hbbr: {}
