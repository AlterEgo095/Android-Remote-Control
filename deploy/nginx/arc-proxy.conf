# Android Remote Control — paramètres de proxy communs (Nginx)
# Installation : cp deploy/nginx/arc-proxy.conf /etc/nginx/snippets/arc-proxy.conf
# Puis `include /etc/nginx/snippets/arc-proxy.conf;` dans chaque location.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# XFF écrasé avec l'IP réelle ($remote_addr, déjà corrigée par realip Cloudflare) :
# JAMAIS $proxy_add_x_forwarded_for derrière un CDN — le client pourrait usurper
# le premier élément de la chaîne et contourner le rate-limit de login (VLA-1).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;      # WebSocket (réservé aux évolutions)
proxy_set_header Connection "upgrade";
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 10s;
proxy_buffering off;
