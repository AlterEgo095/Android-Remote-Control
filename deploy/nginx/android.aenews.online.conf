# ============================================================================
# Android Remote Control — Nginx pour https://android.aenews.online
# Fichier PRÉPARÉ (non installé) — à installer après l'audit du VPS :
#   1. Vérifier que le port 3000 n'est pas déjà pris par une autre app (audit).
#   2. cp deploy/nginx/arc-proxy.conf /etc/nginx/snippets/arc-proxy.conf
#      cp deploy/nginx/android.aenews.online.conf /etc/nginx/sites-available/
#   3. Émettre le certificat (certbot --nginx -d android.aenews.online) —
#      NE PAS le faire avant validation DNS (voir docs/PLAN-DEPLOIEMENT.md).
#   4. ln -s /etc/nginx/sites-available/android.aenews.online.conf /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
# L'application écoute sur 127.0.0.1:3000 (aucune exposition directe).
# ============================================================================

# Anti-bruteforce applicatif (en complément du rate-limit interne de l'API) :
# 10 requêtes/minute par IP sur le endpoint de connexion.
limit_req_zone $binary_remote_addr zone=arc_login:10m rate=10r/m;
# Garde-fou global sur l'API : 120 requêtes/minute par IP (le polling console
# consomme ~2 req/4 s par session, marge large).
limit_req_zone $binary_remote_addr zone=arc_api:10m rate=120r/m;

# ——— HTTP → HTTPS (ACME http-01 laissé ouvert pour certbot) ———
server {
    listen 80;
    listen [::]:80;
    server_name android.aenews.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ——— HTTPS ———
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name android.aenews.online;

    # Certificats : émis par certbot (Let's Encrypt) après vérification DNS.
    ssl_certificate     /etc/letsencrypt/live/android.aenews.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/android.aenews.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ARC_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS une fois le TLS validé (2 ans, pas de preload volontaire).
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;
    server_tokens off;

    access_log /var/log/nginx/android.aenews.online.access.log;
    error_log  /var/log/nginx/android.aenews.online.error.log warn;

    # ——— Health minimal (pas de log d'accès, exposition réduite) ———
    location = /health {
        include /etc/nginx/snippets/arc-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # ——— Endpoint de connexion : limitation dédiée anti-bruteforce ———
    location = /api/auth/login {
        limit_req zone=arc_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/arc-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # ——— API (contrat actuel : /api/*) ———
    location /api/ {
        limit_req zone=arc_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/arc-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # ——— Réservé à une future versionnement d'API (/api/v1/* → /api/*) ———
    # location /api/v1/ {
    #     limit_req zone=arc_api burst=40 nodelay;
    #     include /etc/nginx/snippets/arc-proxy.conf;
    #     rewrite ^/api/v1/(.*)$ /api/$1 break;
    #     proxy_pass http://127.0.0.1:3000;
    # }

    # ——— Console web (SPA Next.js) ———
    location / {
        include /etc/nginx/snippets/arc-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
