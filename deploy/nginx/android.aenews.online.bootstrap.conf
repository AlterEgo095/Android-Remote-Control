# ============================================================================
# Android Remote Control — VHOST D'AMORÇAGE (port 80 uniquement)
# Objectif : permettre l'émission du certificat Let's Encrypt (HTTP-01) SANS
# activer le bloc 443 (qui référence un certificat pas encore émis).
#
# Procédure (détaillée dans docs/PLAN-DEPLOIEMENT.md §6) :
#   1. sudo cp deploy/nginx/arc-proxy.conf /etc/nginx/snippets/
#   2. sudo cp deploy/nginx/android.aenews.online.bootstrap.conf \
#        /etc/nginx/sites-available/android.aenews.online.conf
#   3. sudo ln -s ../sites-available/android.aenews.online.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot certonly --webroot -w /var/www/certbot \
#        -d android.aenews.online --key-type ecdsa
#   6. sudo cp deploy/nginx/android.aenews.online.conf \
#        /etc/nginx/sites-available/android.aenews.online.conf   # vhost complet 80+443
#   7. sudo nginx -t && sudo systemctl reload nginx
# Ce fichier est ensuite REMPLACÉ (étape 6) — il n'expose que l'ACME et 503.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name android.aenews.online;

    # Challenge ACME — webroot convention du VPS (audit 2026-10-17)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tant que le certificat n'est pas émis : rien d'autre n'est servi.
    location / {
        return 503;
    }
}
